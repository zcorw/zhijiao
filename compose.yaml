name: ${COMPOSE_PROJECT_NAME:-zhijiao}
services:
  app:
    image: ${APP_IMAGE:-zhijiao:local}
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3000"
      STATIC_DIR: /app/apps/web/dist
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the exact browser origin}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-zhijiao}
      DATABASE_NAME: ${DATABASE_NAME:-zhijiao}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
    secrets:
      - db_password
      - session_secret
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-zhijiao}
      POSTGRES_USER: ${DATABASE_USER:-zhijiao}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres-data:
secrets:
  db_password:
    file: ${DATABASE_PASSWORD_PATH:-./.local/secrets/db-password}
  session_secret:
    file: ${SESSION_SECRET_PATH:-./.local/secrets/session-secret}
