# Optional DeepSeek analysis overlay. Prepare the key file before starting app.
services:
  app:
    environment:
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    secrets:
      - deepseek_api_key
secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_PATH:-./.local/secrets/deepseek-api-key}
