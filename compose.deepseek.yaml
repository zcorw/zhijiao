# Optional: docker compose -f compose.yaml -f compose.deepseek.yaml up -d app
services:
  app:
    environment:
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      INTERACTION_AI_TIMEOUT_MS: ${INTERACTION_AI_TIMEOUT_MS:-60000}
    secrets:
      - deepseek_api_key
secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_PATH:-./.local/secrets/deepseek-api-key}
