name: Publish approved image
# Manual publishing only. This workflow never connects to a VPS.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  publish:
    needs: checks
    if: github.repository == 'zcorw/zhijiao' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require the authorized private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = true
      - name: Refuse an existing public package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          gh api users/zcorw/packages/container/zhijiao --jq .visibility >package-visibility.txt 2>package-error.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test "$(cat package-visibility.txt)" = private
          elif ! grep -q '(HTTP 404)' package-error.txt; then
            echo 'Could not verify package visibility; publication blocked.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published commit tag
        env:
          IMAGE: ghcr.io/zcorw/zhijiao:sha-${{ github.sha }}
        run: |
          # A missing tag is allowed only after an authenticated registry response.
          # Any other error (including authorization/network) blocks publication.
          set -euo pipefail
          set +e
          docker buildx imagetools inspect "$IMAGE" >existing-image.txt 2>inspect-error.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'This commit tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          if grep -Eiq 'unauthorized|denied|timeout|no such host|connection refused' inspect-error.txt || ! grep -Eiq 'manifest unknown|not found' inspect-error.txt; then
            echo 'Could not confirm tag absence; publication blocked.' >&2
            exit 1
          fi
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zcorw/zhijiao:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zcorw/zhijiao
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable deployment reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'ghcr.io/zcorw/zhijiao@%s\n' "$DIGEST" >image-reference.txt
          printf 'Validated commit: `%s`\n\nDeploy image: `ghcr.io/zcorw/zhijiao@%s`\n' "$GITHUB_SHA" "$DIGEST" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-reference-${{ github.sha }}
          path: image-reference.txt
