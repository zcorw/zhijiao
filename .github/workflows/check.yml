name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Typecheck, lint, unit, PostgreSQL integration, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: zhijiao_ci
          POSTGRES_DB: zhijiao_test
          # A disposable test fixture, never a runtime credential.
          POSTGRES_PASSWORD: ci-only-not-a-runtime-secret
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U zhijiao_ci -d zhijiao_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://zhijiao_ci:ci-only-not-a-runtime-secret@127.0.0.1:5432/zhijiao_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check deployment flow with mocked tools
        run: bash tests/ops/deploy.test.sh
      - run: npm run test:integration
      - run: npm run build
      - name: Validate container configuration
        run: |
          APP_ORIGIN=https://ci.example.invalid docker compose config --quiet
      - name: Build application image without publishing
        run: docker build --tag zhijiao:ci .
